name: Build and scan

on:
  pull_request:
    branches: [feature3]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upwind image scan
        uses: upwindsecurity/shiftleft-create-image-scan-event-action@main
        with:
          docker_image: ghcr.io/rronen04/sample-app:c3cd5c2a65383d6aec9409d50ac8012bd5a90d72
          pull_image: false
          main_branch: ${{ github.base_ref }}
          pr_id: ${{ github.event.number }}
          add_comment: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
          pr_number: ${{ github.event.number }}
          repo_name: ${{ github.repository }}
          upwind_client_id: ${{ secrets.UPWIND_CLIENT_ID }}
          upwind_client_secret: ${{ secrets.UPWIND_CLIENT_SECRET }}
